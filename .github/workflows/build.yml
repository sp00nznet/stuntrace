name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: SDL2 via vcpkg
        run: |
          vcpkg install sdl2:x64-windows
          echo "VCPKG_TOOLCHAIN=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN"

      - name: Build
        run: cmake --build build --config Release

      # The ROM cannot be distributed, and there is no conformance harness yet
      # (ROADMAP.md). CI proves the tree builds.
      - name: Conformance
        run: echo "conformance: skipped (no harness yet, and it would need a user-supplied ROM)"
